<!DOCTYPE html>
<html lang="en" data-theme="light" data-motion="normal" data-m3="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Flip</title>
  <!-- Colour maths loads first so the saved accent is painted before anything
       else appears; a flash of the wrong accent is worse than a small script. -->
  <script src="../ui/color.js?v=1795179261"></script>
  <script src="../ui/themes.js?v=1795179261"></script>
  <script>
    (function () {
      try {
        /* Paint the saved theme before the first frame, so a dark choice never
           flashes a light window. */
        if (window.FlipThemes) {
          window.FlipThemes.paintSaved();
        }
        var hue = window.localStorage.getItem("flip.accentHue");
        if (hue !== null && hue !== "" && window.FlipColor) {
          window.FlipColor.applyAccent(Number(hue));
        }
      } catch (err) {
        /* a private window can refuse storage; the snapshot still paints it */
      }
    })();
  </script>
  <link rel="stylesheet" href="../ui/style.css?v=1795179261">
  <link rel="stylesheet" href="../ui/polish.css?v=1795179261">
  <link rel="stylesheet" href="../ui/tokens.css?v=1795179261">
  <link rel="stylesheet" href="../ui/m3.css?v=1795179261">
  <script src="mock.js" defer></script>
  <script src="../ui/i18n.js?v=1795179261" defer></script>
  <script src="../ui/flipcard.js?v=1795179261" defer></script>
  <script src="../ui/board.js?v=1795179261" defer></script>
  <script src="../ui/xlsx.js?v=1795179261" defer></script>
  <script src="../ui/timetable.js?v=1795179261" defer></script>
  <script src="../ui/tasks.js?v=1795179261" defer></script>
  <script src="../ui/dashboard.js?v=1795179261" defer></script>
  <script src="../ui/data.js?v=1795179261" defer></script>
  <script src="../ui/update.js?v=1795179261" defer></script>
  <script src="../ui/telemetry.js?v=1795179261" defer></script>
  <script src="../ui/setup.js?v=1795179261" defer></script>
  <script src="../ui/about.js?v=1795179261" defer></script>
  <script src="../ui/app.js?v=1795179261" defer></script>
  <script src="../ui/m3.js?v=1795179261" defer></script>
</head>
<body>
  <header id="chrome" data-tauri-drag-region>
    <span class="brand">Flip</span>
    <nav id="tabs" role="tablist" aria-label="Sections">
      <button class="tab active" role="tab" id="tab-dashboard" data-view="dashboard" aria-selected="true" aria-controls="dashboard">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.6 12 4l8 6.6V19a1.4 1.4 0 0 1-1.4 1.4h-4.1v-5.7H9.5v5.7H5.4A1.4 1.4 0 0 1 4 19z"></path></svg>
        <span class="tab-label">Dashboard</span>
      </button>
      <button class="tab" role="tab" id="tab-timer" data-view="timer" aria-selected="false" aria-controls="stage">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"></circle><path d="M12 10v4l2.6 1.6M9.5 2.5h5M12 2.5V6"></path></svg>
        <span class="tab-label">Timer</span>
      </button>
      <button class="tab" role="tab" id="tab-timetable" data-view="timetable" aria-selected="false" aria-controls="timetable">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="15" rx="3"></rect><path d="M3.5 10.2h17M8 3.5v4M16 3.5v4"></path></svg>
        <span class="tab-label">Timetable</span>
      </button>
      <button class="tab" role="tab" id="tab-tasks" data-view="tasks" aria-selected="false" aria-controls="tasks">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7.5l2 2 3.5-3.5M4.5 16.5l2 2 3.5-3.5"></path><path d="M12.5 7.5H20M12.5 17.5H20"></path></svg>
        <span class="tab-label">Tasks</span>
      </button>
    </nav>
    <span class="drag-fill" data-tauri-drag-region></span>
    <div class="chrome-right">
      <button id="pin-btn" class="icon-btn" type="button" aria-label="Keep Flip on top" title="Keep Flip on top" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9 4h6M10 4v6l-2.2 3.2a1 1 0 0 0 .82 1.6h6.76a1 1 0 0 0 .82-1.6L14 10V4M12 15v5"></path>
        </svg>
      </button>
      <button id="fullscreen-btn" class="icon-btn" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen (F11)">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path>
        </svg>
      </button>
      <button id="orient-btn" class="icon-btn" type="button" hidden aria-label="Switch to landscape" title="Switch to landscape">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="3" width="10" height="18" rx="2.4"></rect>
          <path d="M10.4 19h3.2"></path>
        </svg>
      </button>
      <button id="sync-btn" class="icon-btn" type="button" aria-label="Wi-Fi sync" title="Wi-Fi sync" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4.6 12a7.4 7.4 0 0 1 12.6-5.2M19.4 12a7.4 7.4 0 0 1-12.6 5.2"></path>
          <path d="M17.6 3.2v3.6H14M6.4 20.8v-3.6H10"></path>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="3.2"></circle>
          <path d="M19.4 13.9a1.6 1.6 0 0 0 .32 1.76l.06.06a1.9 1.9 0 1 1-2.7 2.7l-.06-.06a1.6 1.6 0 0 0-1.76-.32 1.6 1.6 0 0 0-.97 1.47V20a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.76.32l-.06.06a1.9 1.9 0 1 1-2.7-2.7l.06-.06a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.47-.97H4a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.76l-.06-.06a1.9 1.9 0 1 1 2.7-2.7l.06.06a1.6 1.6 0 0 0 1.76.32H9.8a1.6 1.6 0 0 0 .97-1.47V4a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.76-.32l.06-.06a1.9 1.9 0 1 1 2.7 2.7l-.06.06a1.6 1.6 0 0 0-.32 1.76V9.8a1.6 1.6 0 0 0 1.47.97H20a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.47.97z"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="app">
    <!-- Dashboard: the hub, built from widgets the user can rearrange -->
    <section id="dashboard" class="view active" data-view="dashboard" role="tabpanel" aria-labelledby="tab-dashboard">
      <div class="view-head dash-head">
        <div class="view-title">
          <h1 id="dash-greeting">Today</h1>
          <p class="sub" id="dash-sub">-</p>
        </div>
        <div class="head-actions">
          <button class="btn small" type="button" id="dash-arrange" aria-pressed="false">Arrange</button>
          <button class="btn small" type="button" id="dash-reset" hidden>Reset layout</button>
          <button class="btn primary" type="button" id="dash-new-task">New task</button>
        </div>
      </div>
      <div id="dash-grid" class="dash-grid"></div>
    </section>

    <!-- Timer: the original flip display -->
    <main id="stage" class="view" data-view="timer" role="tabpanel" aria-labelledby="tab-timer" hidden>
      <div id="clock-group" class="group l2 active"></div>
      <div id="timer-group" class="group l2">
        <svg id="timer-ring" viewBox="0 0 400 400" aria-hidden="true" focusable="false"></svg>
      </div>
      <div id="timer-transport">
        <button id="timer-toggle" type="button" aria-label="Start timer" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor"><path d="M8 5.2v13.6L19 12z"></path></svg>
        </button>
      </div>
      <div id="timer-tools">
        <button id="timer-set" class="icon-btn" type="button" aria-label="Set timer duration" title="Set timer (S)">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="13.5" r="7"></circle>
            <path d="M12 10v4l2.6 1.6M9.5 2.5h5M12 2.5V6"></path>
          </svg>
        </button>
        <button id="timer-clear" class="icon-btn" type="button" aria-label="Reset timer" title="Reset timer (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
            <path d="M20 4.5V10h-5.5"></path>
          </svg>
        </button>
      </div>
      <div id="rotate-note" class="rotate-note" hidden>
        <p class="rotate-title">The clock needs landscape</p>
        <p class="rotate-sub">Turn the phone sideways to see the flip clock.</p>
        <button class="btn primary" type="button" id="rotate-go">Turn to landscape</button>
      </div>
      <div id="dots" role="group" aria-label="Display">
        <button class="mode-btn active" type="button" data-mode="clock" aria-pressed="true">Clock</button>
        <button class="mode-btn" type="button" data-mode="timer" aria-pressed="false">Timer</button>
      </div>
    </main>

    <!-- Timetable: one column per day, one row per period -->
    <section id="timetable" class="view" data-view="timetable" role="tabpanel" aria-labelledby="tab-timetable" hidden>
      <div class="view-head">
        <div class="view-title">
          <h1>Timetable</h1>
        </div>
        <div class="head-actions">
          <button class="btn icon-only" type="button" id="tt-lock" aria-pressed="false" aria-label="Lock timetable" title="Lock timetable">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="6.5" rx="1.8"/><path d="M5.5 7V5.4a2.5 2.5 0 015 0V7"/></svg>
          </button>
          <label class="check"><input type="checkbox" id="tt-weekend"> <span>Weekend</span></label>
          <button class="btn icon-only" type="button" id="tt-undo" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.5 4.5L2.5 7.5l3 3M2.5 7.5h6.8a3.7 3.7 0 010 7.4H6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn icon-only" type="button" id="tt-redo" title="Redo (Ctrl+Y)" aria-label="Redo">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M10.5 4.5l3 3-3 3M13.5 7.5H6.7a3.7 3.7 0 000 7.4H10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn" type="button" id="tt-import" title="Import a timetable from an .xlsx file">Import</button>
          <button class="btn" type="button" id="tt-template" title="Save an empty timetable you can fill in">Download Template</button>
          <button class="btn" type="button" id="tt-add-period">Add row</button>
          <button class="btn danger" type="button" id="tt-reset">Reset</button>
          <input type="file" id="tt-file" accept=".xlsx" hidden>
        </div>
      </div>
      <div id="tt-dropzone" class="tt-dropzone">
        <span class="tt-dropzone-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5"></path><path d="M7.5 9.5 12 5l4.5 4.5"></path><path d="M5 15v3.2A1.8 1.8 0 0 0 6.8 20h10.4a1.8 1.8 0 0 0 1.8-1.8V15"></path></svg>
        </span>
        <span class="tt-dropzone-text">
          <strong>Drop an .xlsx timetable here</strong>
          <span>or pick one from this computer. Columns become days, rows become periods.</span>
        </span>
        <button class="btn primary" type="button" id="tt-dropzone-import">Choose file</button>
      </div>
      <div id="tt-wave" class="wave-host" hidden></div>
      <div id="tt-brush" class="tt-brush" role="group" aria-label="Subjects" hidden></div>
      <div class="tt-scroll">
        <div id="tt-grid" class="tt-grid" role="grid" aria-label="Weekly timetable"></div>
      </div>
    </section>

    <!-- Tasks: week board, list and smart suggestions -->
    <section id="tasks" class="view" data-view="tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden>
      <div class="view-head">
        <div class="view-title">
          <h1>Tasks</h1>
        </div>
        <div class="head-actions">
          <label class="field inline">
            <span>Subject</span>
            <select id="filter-subject"><option value="">All subjects</option></select>
          </label>
          <label class="check"><input type="checkbox" id="hide-done"> <span>Hide done</span></label>
          <label class="check"><input type="checkbox" id="week-sun"> <span>Week starts Sunday</span></label>
          <div class="seg" role="group" aria-label="Task layout">
            <button class="seg-btn active" type="button" id="view-board" aria-pressed="true">Week</button>
            <button class="seg-btn" type="button" id="view-list" aria-pressed="false">List</button>
          </div>
          <button class="btn primary" type="button" id="new-task">New task</button>
        </div>
      </div>

      <div class="week-bar">
        <button class="icon-btn" type="button" id="week-prev" aria-label="Previous week">‹</button>
        <strong id="week-range">-</strong>
        <button class="btn small" type="button" id="week-today">Today</button>
        <button class="icon-btn" type="button" id="week-next" aria-label="Next week">›</button>
        <div class="progress">
          <div class="track"><span id="week-bar-fill"></span></div>
          <span id="week-count">0 of 0 done this week</span>
        </div>
      </div>

      <div id="suggestions" class="suggestions"></div>
      <div id="task-board" class="task-board"></div>
      <div id="task-list" class="task-list" hidden></div>
    </section>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
